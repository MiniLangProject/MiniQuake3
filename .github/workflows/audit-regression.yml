name: Audit regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'tests/**'
      - 'PORT_LEDGER.json'
      - 'docs/ORIGINAL_PARITY_REPORT.md'
      - '.github/workflows/audit-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'tests/**'
      - 'PORT_LEDGER.json'
      - 'docs/ORIGINAL_PARITY_REPORT.md'
      - '.github/workflows/audit-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      MQ3_BUILD_TOOLCHAIN: release
    steps:
      - name: Preserve source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test the checked-out sources without modifying them
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess, sys, tempfile, time
          output = Path('build/core-acceptance')
          output.mkdir(parents=True, exist_ok=True)
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          initial = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
                     for p in tracked if p and Path(p).is_file()}
          report = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'status': 'running', 'steps': [],
                    'limits': ['No retail assets, graphical playthrough or GPU benchmark in this job.',
                               'Routing reference is a scenario model, not unchanged original C.']}
          steps = [
              ('inventory', [sys.executable, 'scripts/test_audit_inventory.py', '-v']),
              ('original-source', [sys.executable, 'scripts/test_parity_inventory.py']),
              ('timing-build', [sys.executable, 'scripts/build.py', '--source', 'tests/audit_timing_lru_contracts.ml', '--output', 'audit_timing_lru_contracts.exe']),
              ('timing-native', ['build/audit_timing_lru_contracts.exe']),
              ('routing', [sys.executable, 'scripts/test_aas_routing_cache.py']),
              ('game-build', [sys.executable, 'scripts/build_release.py'])]
          try:
              with tempfile.TemporaryDirectory(prefix='mq3-core-') as home:
                  os.environ['MINIQUAKE3_HOME'] = home
                  for name, command in steps:
                      start = time.monotonic()
                      logfile = output / (name + '.log')
                      with logfile.open('w', encoding='utf-8') as stream:
                          result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, timeout=1200)
                      report['steps'].append({'name': name, 'exit_code': result.returncode,
                                              'seconds': round(time.monotonic()-start, 3)})
                      print(logfile.read_text(encoding='utf-8', errors='replace')[-16000:], flush=True)
                      if result.returncode:
                          raise RuntimeError(name + ' failed')
              changed = [p for p, expected in initial.items()
                         if not Path(p).is_file() or hashlib.sha256(Path(p).read_bytes()).hexdigest() != expected]
              if changed:
                  raise RuntimeError('Tracked source files changed during testing: ' + ', '.join(changed))
              report['source_files_unchanged'] = True
              report['status'] = 'passed'
          except BaseException as error:
              report['status'] = 'failed'
              report['error'] = str(error)
              raise
          finally:
              (output / 'report.json').write_text(json.dumps(report, indent=2)+'\n', encoding='utf-8')
              (output / 'source-hashes.json').write_text(json.dumps(initial, indent=2)+'\n', encoding='utf-8')
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-acceptance
          path: |
            build/core-acceptance/**
            build/*.log
          retention-days: 14
          if-no-files-found: warn
