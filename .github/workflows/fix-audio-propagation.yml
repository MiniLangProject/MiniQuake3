name: Catch optional audio startup errors
on:
  push:
    branches: [test/retail-start-20261116]
    paths: [.github/workflows/fix-audio-propagation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/retail-start-20261116
      - name: Add explicit error capture to the already reviewed silent-start fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          old = 'audioStarted=audioOutput.init(22050);if audioStarted is error then print "Warning: audio output unavailable; continuing without sound." end if'
          new = 'audioStarted=try(audioOutput.init(22050));if audioStarted is error then print "Warning: audio output unavailable; continuing without sound." end if'
          paths = [Path('src/mq3/client/qvm_menu_app.ml'), Path('src/mq3/client/qvm_preview_app.ml')]
          edits = []
          for path in paths:
              raw = path.read_bytes()
              text = raw.decode('utf-8')
              if text.count(new) == 1 and old not in text:
                  print(str(path) + ': exact fix already present')
                  continue
              assert text.count(old) == 1 and new not in text, 'Unexpected startup source: ' + str(path)
              updated = text.replace(old, new).encode('utf-8')
              edits.append((path, updated))
              print(str(path), hashlib.sha256(raw).hexdigest(), '->', hashlib.sha256(updated).hexdigest())
          for path, updated in edits:
              path.write_bytes(updated)
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mq3/client/qvm_menu_app.ml src/mq3/client/qvm_preview_app.ml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(audio): catch device initialization errors with try before silent fallback'
          git push origin HEAD:refs/heads/test/retail-start-20261116
