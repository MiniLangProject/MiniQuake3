name: Finish master branch cleanup

on:
  push:
    branches: [master]
    paths: ['.github/workflows/finish-master-cleanup.yml']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finish-master-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'MiniLangProject/MiniQuake3' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Preserve the exact main head, then delete only main
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, pathlib, subprocess, urllib.request
          repo = 'MiniLangProject/MiniQuake3'
          expected = '03f20a57778a5be8fe12af3e1ead3e8db99ada7e'
          branch = 'refs/heads/main'
          tag = 'refs/tags/archive/2026-11-17/main'
          report = {'status': 'running', 'expected_main': expected, 'archive_tag': tag}
          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'User-Agent': 'MiniQuake3-housekeeping'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def refs():
              return {line.split()[1]: line.split()[0]
                      for line in git('ls-remote', 'origin', branch, tag).splitlines()}
          try:
              if api('')['default_branch'] != 'master':
                  raise RuntimeError('Default branch changed; no deletion attempted')
              subprocess.run(['git', 'merge-base', '--is-ancestor', expected, 'HEAD'], check=True)
              changed = git('diff', '--name-only', expected, 'HEAD', '--', 'src', 'native', 'tests', 'scripts', 'PORT_LEDGER.json')
              if changed:
                  raise RuntimeError('Unexpected runtime differences: ' + changed)
              remote = refs()
              if remote.get(branch) != expected:
                  raise RuntimeError('main moved or disappeared; no deletion attempted')
              if remote.get(tag) not in (None, expected):
                  raise RuntimeError('Archive tag already points elsewhere')
              info = api('/branches/main')
              if info['protected'] or info['commit']['sha'] != expected:
                  raise RuntimeError('main is protected or changed')
              if api('/pulls?state=open&head=MiniLangProject%3Amain&per_page=100'):
                  raise RuntimeError('An open pull request still uses main')
              subprocess.run(['git', 'push', '--atomic',
                  '--force-with-lease=' + branch + ':' + expected,
                  'origin', expected + ':' + tag, ':' + branch], check=True)
              final = refs()
              if branch in final or final.get(tag) != expected:
                  raise RuntimeError('Remote archive/deletion verification failed')
              report.update(status='completed', default_branch=api('')['default_branch'],
                            deleted=['main'], archived_sha=final[tag],
                            remaining_branches=[b['name'] for b in api('/branches?per_page=100')])
              print(json.dumps(report, indent=2))
          except BaseException as error:
              report.update(status='failed', error=str(error))
              raise
          finally:
              pathlib.Path('master-cleanup-report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
      - name: Preserve cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-cleanup-20261117
          path: master-cleanup-report.json
          retention-days: 14
