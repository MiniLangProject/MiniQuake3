name: Protocol 68 compatibility
on:
  push:
    branches: [master, fix/network-protocol68-20261117]
    paths: ['src/**', 'native/**', 'tests/**', 'scripts/**', '.github/workflows/protocol68.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protocol68-${{ github.ref }}
  cancel-in-progress: true
jobs:
  network:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      MQ3_BUILD_TOOLCHAIN: release
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Original comparisons, UDP regressions and microbenchmarks
        shell: pwsh
        run: |
          python scripts/run_protocol68_regression.py
          if ($LASTEXITCODE -ne 0) { throw 'Protocol regression failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protocol68-evidence
          path: |
            build/protocol68-evidence/**
            build/reference/**/result.json
            build/reference/**/*.log
            build/*.log
          retention-days: 14
  original-server:
    # Retail assets are used only for explicit acceptance, never ordinary master pushes.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix/network-protocol68-20261117'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MQ3_BUILD_TOOLCHAIN: release
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Download and verify the user-requested retail CD for this test only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $item = 'Quake_III_Arena_Id_Software_1999'
          $url = "https://archive.org/download/$item/$item.iso"
          $iso = Join-Path $env:RUNNER_TEMP "$item.iso"
          $expected = [long]555732992
          $chunk = [long][Math]::Ceiling($expected / 4.0)
          New-Item -ItemType Directory -Force build/baseq3, build/protocol68-original | Out-Null
          0..3 | ForEach-Object -Parallel {
            $start = [long]$_ * $using:chunk
            $end = [Math]::Min($using:expected - 1, $start + $using:chunk - 1)
            $part = "$using:iso.part$_"
            & curl.exe --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 600 --range "$start-$end" --output $part $using:url
            if ($LASTEXITCODE -ne 0 -or (Get-Item $part).Length -ne ($end-$start+1)) { throw "CD segment $_ failed" }
          } -ThrottleLimit 4
          $combined = [IO.File]::Create($iso)
          try {
            foreach ($number in 0..3) {
              $stream = [IO.File]::OpenRead("$iso.part$number")
              try { $stream.CopyTo($combined) } finally { $stream.Dispose() }
            }
          } finally { $combined.Dispose() }
          $sha = (Get-FileHash $iso -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item $iso).Length -ne $expected -or $sha -ne 'd44fb1f9a68530169a5947aa9011fe84296ef2ba86e56e8a6baedbd71973ae09') { throw 'Retail CD checksum mismatch' }
          @{url=$url; size=$expected; sha256=$sha; verified=$true} | ConvertTo-Json | Set-Content build/protocol68-original/cd-download.json
          $seven = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          $listing = & $seven l -slt $iso
          if ($LASTEXITCODE -ne 0) { throw 'CD filesystem read failed' }
          $paths = @($listing | Where-Object { $_ -match '^Path = (.*)' } | ForEach-Object { $_.Substring(7) } | Where-Object { $_ -match '(?i)(^|[/\\])baseq3[/\\]pak[0-9]+\.pk3$' })
          if ($paths.Count -eq 0) { throw 'No retail archives on CD' }
          foreach ($path in $paths) {
            & $seven e -y "-o$pwd/build/baseq3" $iso $path
            if ($LASTEXITCODE -ne 0) { throw "Extraction failed: $path" }
          }
          Get-ChildItem build/baseq3 -File | ForEach-Object {
            if ($_.Name -cne $_.Name.ToLowerInvariant()) { Rename-Item $_.FullName $_.Name.ToLowerInvariant() }
          }
          python -c "import zipfile; z=zipfile.ZipFile('build/baseq3/pak0.pk3'); assert z.testzip() is None; assert {'maps/q3dm0.bsp','maps/q3dm1.bsp'} <= set(z.namelist()); print('PASS: retail archive CRCs and both arenas')"
          if ($LASTEXITCODE -ne 0) { throw 'Retail archive validation failed' }
          Remove-Item $iso, "$iso.part*"
      - name: Exercise actual original dedicated server over loopback UDP
        shell: pwsh
        run: |
          python scripts/test_original_server_interop.py --data-root build
          if ($LASTEXITCODE -ne 0) { throw 'Original server interoperability failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked sources changed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-server-evidence
          path: |
            build/protocol68-original/*.json
            build/protocol68-original/*.log
            build/reference/engine-link.log
            build/reference/engine/*.log
            build/*.log
          retention-days: 14
