[project]
name = "MiniQuake3"
description = "MiniLang Quake III Arena port with client, game, bot, renderer, and platform subsystems."
entry = "src/main.ml"
source_roots = ["src"]
include = ["src", "../MiniLangCompilerML"]
exclude = ["build", "artifacts", "docs/api", "tests", "Quake-III-Arena-original-source"]
target = "windows-x64"

[documentation]
include_internal = true
reachable_only = false
strict = false
dependencies = "summary"
contract_warnings = "public"
summary_quality_warnings = "public"
duplicate_summary_threshold = 10
page_granularity = "container"

[output]
formats = ["html", "markdown"]
html_dir = "docs/api/html"
markdown_dir = "docs/api/markdown"
markdown_profile = "repository"
include_timestamp = false

[graphs]
imports = true
calls = true
types = true
max_nodes = 300
granularity = "package"
hide_empty = true

[links]
repository = "https://github.com/n1k0m0/MiniQuake3"
ref = "main"
